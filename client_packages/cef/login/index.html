<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="../assets/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="../assets/css/global-theme.css" rel="stylesheet"/>
        <link href="style.css" rel="stylesheet"/>
    </head>
    <body>
        <div class="card bg-dark">
            <div class="card-body">
                <h1 class="text-center">Brasil Gang War</h1>
                <form>
					<div class="alert alert-danger" role="alert"></div>
					
                    <div class="form-group">
                        <label class="text-white" for="loginName">Usuário</label>
                        <input type="text" name="username" id="loginName" class="form-control" autofocus required>
                    </div>
                    <div class="form-group">
                        <label class="text-white" for="loginPass">Senha</label>
                        <input type="password" name="password" id="loginPass" class="form-control" required>
					</div>
					
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-block" onclick="sendAccountInfo(0);">Login</button>
                    <small class="text-white">Não tem uma conta? <a href="register.html">Registre-se aqui</a></small>
                </form>
            </div>
		</div>
        <script src="../assets/js/jquery.js"></script>
        <script src="script.js"></script>
    </body>
</html>
